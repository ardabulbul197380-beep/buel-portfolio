name: Deploy BUEL to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild original BUEL V5 site
        shell: bash
        run: |
          set -euo pipefail
          cat source/v5.part1 source/v5.part2 source/v5.part3 source/v5.part4 | base64 -d > /tmp/buel-v5.zip
          echo "56a93e0f2357436a0d304d68cfda4602602c7777d8572b7f8713ee1cee6e659e  /tmp/buel-v5.zip" | sha256sum -c -
          rm -rf /tmp/buel-v5 _site
          mkdir -p /tmp/buel-v5 _site
          unzip -q /tmp/buel-v5.zip -d /tmp/buel-v5
          cp -a /tmp/buel-v5/buel-portfolio/. _site/
          printf 'buelstudio.com\n' > _site/CNAME
          test -s _site/styles.css
          test -s _site/script.js
          test -s _site/index.html
          echo "styles.css: $(wc -c < _site/styles.css) bytes"
          echo "script.js: $(wc -c < _site/script.js) bytes"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
